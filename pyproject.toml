[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opa-test-framework"
version = "0.1.0"
description = "Automated testing framework for Open Policy Agent (OPA) deployments"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Organization"}
]
dependencies = [
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "hypothesis>=6.141.1",
    "pyyaml>=6.0.3",
    "click>=8.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.1.0",
    "black>=25.11.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pytest-html>=4.2.0",
    "types-PyYAML>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]

[project.scripts]
opa-test = "opa_test_framework.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "smoke: marks tests as smoke tests (fast, critical)",
    "integration: marks tests as integration tests (require OPA instance)",
    "property: marks tests as property-based tests",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
